<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071233">
<title>NEXORA Admin — Boshqaruv paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="a-dash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/>
    <rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>
  </symbol>
  <symbol id="a-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 4.5 7v10L12 21l7.5-4V7L12 3Z"/><path d="M4.5 7 12 11l7.5-4M12 11v10"/>
  </symbol>
  <symbol id="a-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c1.2-3.4 3.7-4.7 6.2-4.7s5 1.3 6.2 4.7"/>
    <circle cx="17" cy="9" r="2.4"/><path d="M16 15.3c2.3.2 4.2 1.5 5.2 4.2"/>
  </symbol>
  <symbol id="a-game" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 7.5h10a4.5 4.5 0 0 1 4.4 5.4l-.7 3.1a3 3 0 0 1-5.1 1.3L14 15.5h-4l-1.6 1.8a3 3 0 0 1-5.1-1.3l-.7-3.1A4.5 4.5 0 0 1 7 7.5Z"/>
    <path d="M8 11v3M6.5 12.5h3"/>
  </symbol>
  <symbol id="a-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M3 6.5h18v3.5H3zM12 6.5V20"/>
  </symbol>
  <symbol id="a-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 14.5h4"/>
  </symbol>
  <symbol id="a-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.5a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.5h4l.4-2.5a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/>
  </symbol>
  <symbol id="a-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4H6a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 6 20h8M10 8l4 4-4 4M14 12H21"/>
  </symbol>
  <symbol id="a-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="a-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h4l11-11a2.1 2.1 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/>
  </symbol>
  <symbol id="a-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M9.5 4.5h5M7 7l1 13.5h8L17 7M10 11v6M14 11v6"/>
  </symbol>
  <symbol id="a-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="a-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></symbol>
  <symbol id="a-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>
  </symbol>
  <symbol id="a-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2.5 4.5 13.5H11L9.5 21.5 19 10h-6.5L13 2.5Z"/></symbol>
  <symbol id="a-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"/></symbol>
  <symbol id="a-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A7.5 7.5 0 0 1 10.5 4 6.8 6.8 0 1 0 20 13.5Z"/></symbol>
  <symbol id="a-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.3 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.3-3.5-8.5S9.7 5.9 12 3.5Z"/></symbol>
  <symbol id="a-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4.5M7.5 9 12 4.5 16.5 9"/><path d="M4 20.5h16"/></symbol>
  <symbol id="a-burger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="a-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></symbol>
  <symbol id="a-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/></symbol>
</svg>

<div class="bg" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span></div>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap" hidden>
  <div class="login-card pop">
    <div class="login-logo float"><svg><use href="#a-bolt"/></svg></div>
    <h1>NEXORA <span>ADMIN</span></h1>
    <p data-i18n="login_sub">Boshqaruv paneliga kirish</p>
    <div class="field">
      <input type="password" id="loginPass" data-i18n-ph="login_ph" placeholder="Admin paroli" autocomplete="current-password">
    </div>
    <p class="form-err" id="loginErr" hidden></p>
    <button class="btn primary big" id="loginBtn"><span data-i18n="login_btn">Kirish</span></button>
  </div>
</div>

<!-- SHELL -->
<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <div class="side-brand">
      <span class="brand-logo"><svg><use href="#a-bolt"/></svg></span>
      <b>NEXORA<small>ADMIN</small></b>
    </div>
    <nav class="side-nav" id="sideNav">
      <button class="sn active" data-page="dash"><svg><use href="#a-dash"/></svg><span data-i18n="m_dash">Dashboard</span></button>
      <button class="sn" data-page="orders"><svg><use href="#a-box"/></svg><span data-i18n="m_orders">Buyurtmalar</span><em class="badge" id="navPending" hidden></em></button>
      <button class="sn" data-page="users"><svg><use href="#a-users"/></svg><span data-i18n="m_users">Foydalanuvchilar</span></button>
      <button class="sn" data-page="games"><svg><use href="#a-game"/></svg><span data-i18n="m_games">O'yinlar</span></button>
      <button class="sn" data-page="packages"><svg><use href="#a-gift"/></svg><span data-i18n="m_packages">Paketlar</span></button>
      <button class="sn" data-page="payments"><svg><use href="#a-card"/></svg><span data-i18n="m_payments">To'lovlar</span></button>
      <button class="sn" data-page="settings"><svg><use href="#a-gear"/></svg><span data-i18n="m_settings">Sozlamalar</span></button>
    </nav>
    <div class="side-foot">
      <button class="sn mini" id="aLangBtn"><svg><use href="#a-globe"/></svg><span id="aLangCode">UZ</span></button>
      <button class="sn mini" id="aThemeBtn"><svg><use href="#a-moon" id="aThemeUse"/></svg><span data-i18n="m_theme">Mavzu</span></button>
      <button class="sn mini danger" id="logoutBtn"><svg><use href="#a-out"/></svg><span data-i18n="m_logout">Chiqish</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="abar">
      <button class="icon-btn only-mobile" id="burger"><svg><use href="#a-burger"/></svg></button>
      <h2 id="pageTitle">Dashboard</h2>
      <a class="pill-btn" href="/" target="_blank"><svg class="ic"><use href="#a-eye"/></svg><span data-i18n="m_view">WebApp</span></a>
    </header>
    <main class="apage" id="apage"><div class="loading-dots"><span></span><span></span><span></span></div></main>
  </div>
</div>

<div id="amodalRoot"></div>
<div id="atoastRoot"></div>

<script src="/static/js/admin.js"></script>
</body>
</html>
